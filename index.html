<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&" />
</head>
<body>
    <header>
        <div class="container">
            <div class="gmail">Gmail</div>
            <div class="imagens">Imagens</div>
            <div class="app-dots"><span class="material-symbols-outlined">apps</span></div>
            <div class="fazerlogin">Fazer Login</div>
        </div>
    </header>
    <h1>
        <span class="colorBlue">G</span>
        <span class="colorRed">o</span>
        <span class="colorYellow">o</span>
        <span class="colorBlue">g</span>
        <span class="colorGreen">l</span>
        <span class="colorRed">e</span>
    </h1>
    <div class="input-container">
        <span class="material-symbols-outlined">search</span>
        <input  class="searchbar" type="text">
        <span class="material-symbols-outlined" id="keyboard_voice">keyboard_voice</span>
        <span class="material-symbols-outlined" id="photo_camera">photo_camera</span>
    </div>
    <div id="butons">
        <input type="button" value="Pesquisa Google">
        <input type="button" value="Estou com sorte">
    </div>
    
</body>
</html>
